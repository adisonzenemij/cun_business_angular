<section class="dashboard container-fluid">
  <h1 class="h2 mb-2">Panel de Control</h1>
  <p class="text-body-secondary mb-4">Resumen de registros por módulo.</p>
  <div class="row g-3">
    @for (module of modules(); track module.resource) {
    <div class="col-12 col-sm-6 col-xl-3">
      <a class="card dashboard-card h-100 text-decoration-none" [routerLink]="module.path">
        <div class="card-body d-flex align-items-center gap-3">
          <span class="dashboard-icon"><i class="bi {{ module.icon }}"></i></span>
          <span>
            <span class="d-block fw-semibold">{{ module.title }}</span>
            <span class="text-body-secondary small">
              {{ module.count === null ? (loading() ? 'Cargando...' : 'No disponible') : module.count }} registros
            </span>
          </span>
        </div>
      </a>
    </div>
    }
  </div>
</section>
