<main class="login-page container"><div class="row justify-content-center w-100"><div class="col-12 col-sm-10 col-md-7 col-lg-5"><form class="login-card card shadow border-0" [formGroup]="form" (ngSubmit)="submit()"><div class="card-header bg-primary text-white"><h1 class="h4 mb-0"><i class="bi bi-box-arrow-in-right me-2"></i>Iniciar sesión</h1></div><div class="card-body"><p class="text-muted">Accede a la administración de encuestas.</p><label class="form-label" for="fd_login">Usuario</label><input id="fd_login" class="form-control" formControlName="fd_login" autocomplete="username" [readOnly]="loading()" />
    @if (form.controls.fd_login.touched && form.controls.fd_login.invalid) { <small>El usuario es obligatorio.</small> }
    <label class="form-label mt-3" for="fd_passd">Contraseña</label><input id="fd_passd" class="form-control" type="password" formControlName="fd_passd" autocomplete="current-password" [readOnly]="loading()" />
    @if (form.controls.fd_passd.touched && form.controls.fd_passd.invalid) { <small>La contraseña es obligatoria.</small> }
    @if (error()) { <p class="error">{{ error() }}</p> }
    <button class="btn btn-primary w-100 mt-3" type="submit" [disabled]="loading()">{{ loading() ? 'Ingresando…' : 'Ingresar' }}</button></div></form></div></div></main>
